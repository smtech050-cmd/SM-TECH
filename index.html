<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SM TECH</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f4f4;
            padding-bottom: 70px;
        }

        /* হেডার ও লোগো বার */
        header {
            background-color: #000;
            color: #fff;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .menu-btn {
            font-size: 24px;
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #00e676;
        }

        /* বাম পাশের সাইডবার (Sidebar / Menu Bar) */
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            background-color: #111;
            overflow-x: hidden;
            overflow-y: auto;
            transition: 0.3s;
            padding-top: 60px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }
        .sidebar a {
            padding: 15px 25px;
            text-decoration: none;
            font-size: 16px;
            color: #ddd;
            display: block;
            transition: 0.2s;
            border-bottom: 1px solid #222;
        }
        .sidebar a:hover {
            background-color: #00e676;
            color: #000;
            font-weight: bold;
        }

        /* সাব-লিঙ্কের জন্য স্টাইল */
        .sidebar a.sub-link {
            padding-left: 45px;
            font-size: 14px;
            color: #aaa;
            background-color: #181818;
            border-bottom: 1px solid #282828;
        }
        .sidebar a.sub-link:hover {
            color: #000;
            background-color: #00e676;
            font-weight: bold;
        }

        .sidebar .close-btn {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 30px;
            color: #fff;
            cursor: pointer;
        }

        /* ওভারলে */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        /* ব্যানার সেকশন */
        .banner {
            width: 100%;
            background-color: #111;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .banner-img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* প্রোডাক্ট কার্ড */
        .products {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 10px;
        }
        .card {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .card h4 {
            margin: 10px 0 5px;
        }
        .card p {
            color: #00e676;
            font-weight: bold;
        }

        /* নিচের ফিক্সড নেভিগেশন বার */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #0d5c3a;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.2);
            z-index: 900;
        }
        .nav-item {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- বাম পাশের সাইডবার মেনু -->
    <div id="mySidebar" class="sidebar">
        <span class="close-btn" onclick="closeNav()">&times;</span>
        <a href="#">📊 ড্যাশবোর্ড</a>
        <a href="#">📦 স্টক পণ্য</a>
        <a href="#">🛍️ সেল পণ্য</a>
        <a href="#">🧾 ইনভয়েস</a>
        
        <!-- এডুকেশন প্রধান অপশন -->
        <a href="#">🎓 এডুকেশন</a>
        
        <!-- সাব-লিঙ্কসমূহ -->
        <a href="http://bmeb.gov.bd/" target="_blank" class="sub-link">🔗 মাদ্রাসা বোর্ড</a>
        <a href="https://dme.gov.bd/" target="_blank" class="sub-link">🔗 মাদ্রাসা শিক্ষা অধিদপ্তর</a>
        <a href="https://www.memis.gov.bd" target="_blank" class="sub-link">🔗 মেমিস (MEMIS)</a>
        <a href="https://www.dhakaeducationboard.gov.bd" target="_blank" class="sub-link">🔗 ঢাকা শিক্ষা বোর্ড</a>
        <a href="https://www.mymensingheducationboard.gov.bd/" target="_blank" class="sub-link">🔗 ময়মনসিংহ শিক্ষা বোর্ড</a>
    </div>

    <!-- ব্যাকগ্রাউন্ড ওভারলে -->
    <div id="overlay" class="overlay" onclick="closeNav()"></div>

    <!-- হেডার -->
    <header>
        <div class="header-left">
            <button class="menu-btn" onclick="openNav()">☰</button>
            <div class="logo">SM TECH</div>
        </div>
        <div>🔍</div>
    </header>

    <!-- ব্যানার (নাম আপডেট করা হয়েছে) -->
    <div class="banner">
        <img src="banner.png" alt="SM-TECH Banner" class="banner-img">
    </div>

    <!-- প্রোডাক্ট ক্যাটাগরি -->
    <div class="products">
        <div class="card">
            <h4>PC Build</h4>
            <p>অফার মূল্য</p>
        </div>
        <div class="card">
            <h4>Accessories</h4>
            <p>ডিসকাউন্ট</p>
        </div>
    </div>

    <!-- নিচের সবুজ নেভিগেশন বার -->
    <div class="bottom-nav">
        <a href="#" class="nav-item">🖥️ PC Builder</a>
        <a href="#" class="nav-item">📢 Campaign</a>
        <a href="#" class="nav-item">👤 Profile</a>
        <a href="#" class="nav-item">🛒 Cart</a>
    </div>

    <!-- সাইডবার কন্ট্রোলের জন্য জাভাস্ক্রিপ্ট -->
    <script>
        function openNav() {
            document.getElementById("mySidebar").style.width = "260px";
            document.getElementById("overlay").style.display = "block";
        }

        function closeNav() {
            document.getElementById("mySidebar").style.width = "0";
            document.getElementById("overlay").style.display = "none";
        }
    </script>

</body>
</html>
